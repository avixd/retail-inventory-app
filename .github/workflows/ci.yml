name: CI

# Front end: lint, production build and an npm vulnerability audit on every push
# and pull request. (The backend's CI runs in its own private repository.)
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          VITE_READ_ONLY: "true"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # on PRs, gitleaks lists the PR's commits through the API
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  accessibility:
    # WCAG 2.0/2.1 A+AA audit (axe-core) of every view in the production build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_READ_ONLY: "true"
      - name: Audit the built site
        shell: bash
        run: |
          npx vite preview --port 4174 --strictPort &
          for i in $(seq 1 30); do curl -fsS http://localhost:4174/retail-inventory-app/ -o /dev/null && break; sleep 1; done
          npm run test:a11y
