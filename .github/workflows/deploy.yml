name: Deploy to GitHub Pages

# Builds the site and publishes it. Runs on push to master and on demand.
# The data (public/snapshot/: twelve month-ends up to the cut-off) is committed
# and frozen, so the build needs no credentials and never calls the backend.
# Publishing newer data is a deliberate release: rebuild the month-end history
# in the backend repo (scripts/build-history-snapshots.sh) and commit it here.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_READ_ONLY: "true"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
